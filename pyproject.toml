[tool.poetry]
name = "pedal"
version = "0.1.0"
description = "A HTTP wrapper for PDAL"
authors = ["Kirill Diordiev <devel@kodors.net>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
fastapi = ">=0.100.0,<1.0.0"
pdal = "^3.2.2"
uvicorn = "^0.23.2"
starlette = "^0.40.0"

# linters
ruff = "^0.1.5"
pydantic = "^2.0.0"
numpy = "^2.0.0"
docarray = "^0.40.0"
boto3 = "^1.38.12"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
extend-exclude = [
    ".git",
    "build",
    "dist",
    "__init__.py"
]

[tool.ruff.lint]
select = ["N", "B", "A", "E", "W", "F", "ASYNC", "S", "D", "I"]
ignore = [
    "PT001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D107",
    "D104",
    "W293",
    "S101",
    "D212",
    "D200",
    "UP007",
    "S105",
    "S311",
    "S106",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"